# Netlify: GitHub auto-deploy from pv-webservices/shubh-caterers-static (branch main).
# HTTPS is forced and www -> apex is handled by Netlify domain settings; dist/_redirects
# (generated by scripts/build.mjs) adds the old *.html -> /clean/ URL redirects.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # dev tools (Playwright, netlify-cli, TypeScript) are only needed locally
  NPM_FLAGS = "--omit=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = "dist"
  port = 8888

# ---------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-src https://maps.google.com https://www.google.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'"

# Fingerprinted CSS/JS (name changes whenever content changes) and versioned fonts: cache for a year
[[headers]]
  for = "/assets/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and videos are not fingerprinted: cache for 30 days
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Utility pages also say noindex in their HTML
[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
